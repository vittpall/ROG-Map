  #############################################
#   Mapping                                 #
#############################################
# The points [out of local map] is considered to be [OUT_OF_MAP]
# The points [out of virtual ceil or ground] is considered to be [OCCUPIED]

rog_map:
  # 0.1. Coarsening to 0.15 was tried as a pinhole mitigation -- bigger cells are
  # harder for a non-repetitive Livox rosette to miss -- and reverted: it cost
  # boundary precision, dragged three other resolutions along with it, and the
  # silhouette detector (occlusion_boundary_node.cpp) addresses pinholes at the
  # source instead, by never looking at UNKNOWN voxels in the first place.
  #
  # THIS VALUE IS NOT LOCAL. Three other resolutions are checked against it or
  # derived from it, and only the first fails loudly:
  #   esdf.resolution below this      -> CounterMap THROWS at startup
  #                                      ("prob_map_resolution should be smaller
  #                                      than or equal to counter_map_resolution")
  #   inflation_resolution not a
  #   multiple of this                -> silently rounded (see below)
  #   occ_resolution, over in
  #   occlusion_mppi/config/occlusion_common.yaml
  #                                   -> OccupancySet hashes the published voxels
  #                                      at the WRONG pitch, so the collision test
  #                                      fires on empty cells and misses the wall.
  #                                      The ego then drives off in a direction
  #                                      unrelated to the goal and NOTHING logs a
  #                                      complaint. This one has already cost a
  #                                      debugging session.
  # Changing this means changing all four.
  resolution: 0.1
  # Must be an integer multiple of `resolution`. counter_map.cpp takes
  # round(inflation_resolution / resolution) and then RECOMPUTES the real value
  # as resolution * that ratio, so anything in between is not an error, it is
  # just discarded -- 0.2 against a 0.15 grid silently became 0.15.
  inflation_resolution: 0.1
  # The halo around every occupied voxel is inflation_step * inflation_resolution.
  # Keep that product at ~0.2 m: it closes the wall's hollow interior (0.2 m
  # thick, so only the front voxel ever gets a return) without merging separate
  # obstacles into each other. At 2 x 0.2 = 0.4 m a forest or random map turns
  # into solid blobs.
  inflation_step: 1
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,0 ]
  frontier_extraction_en: true

  # Virtual ceil and ground
  # A ground plane is technically an occluder: everything below it is hidden,
  # so sub-floor voxels became 'occlusion frontier' all around the drone and
  # d_occ sat at ~2 m even at the start point, making 100% of rollouts
  # infeasible. Nothing emerges from underground -- clamp it away. This is
  # exactly what these two parameters exist for.
  virtual_ceil_height: 4.0
  # 0.0 only clamped voxels BELOW the floor; the floor's own surface (z~0) still
  # passed isFrontier, and unsampled gaps between ground returns became frontier
  # right under the drone. With a 3D keep-out distance those sit ~1 m away and
  # beat the wall at 5 m, so d_occ tracked the floor instead of the occluder.
  # Lifted clear of the surface: nothing below this is unknown, occupied, or
  # frontier. Must stay well under cruise_z.
  virtual_ground_height: 0.3

  block_inf_pt: false
  kd_tree_en: false

  load_pcd_en: false
#  pcd_name: "/home/yunfan/Workspace/rog_ws/src/ROG-Map/examples/rog_map_example/PCD/small_forest_002.pcd"

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: false
    # Kept in step with `resolution` even while disabled: the CounterMap check
    # that rejects a value below the prob map's runs at construction, so a stale
    # 0.1 here kills the node the moment esdf.enable goes back to true.
    resolution: 0.1
    # The range of esdf around the odom [m].
    local_update_box: [ 5,5,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 10
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 50,50,6 ]
    frame_id: "world"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  # Sparse scene (one wall + ground) gives ~800 pts/frame; 1-in-15 starved
  # the map so no voxel ever accumulated enough hits to become OCCUPIED.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: true
    blind_filter_en: false
    blind_filter_dis: 1.0
    batch_update_size: 1
    local_update_box: [ 50,50,5 ]
    # The range of raycasting [m].
    # Was [0, 5]: the map only updated within 5 m, so a wall at y=5 was never
    # mapped and every 'boundary' was really the raycast-range shell.
    # Matched to the mid360 sensing_horizon (15 m).
    ray_range: [ 0.0, 15 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0


